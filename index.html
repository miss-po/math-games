<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>特教數學學習遊戲選單</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; min-height: 100dvh; margin: 0; padding: 20px 16px;
    font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
    background-color: #f0f9ff; display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 700px; text-align: center; margin-bottom: 20px; }
  h1 { font-size: 32px; color: #0284c7; margin: 0 0 8px 0; }
  p { font-size: 20px; color: #475569; margin: 0; font-weight: bold; }
  
  .menu-grid { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 14px; }
  .menu-btn {
    display: flex; align-items: center; justify-content: flex-start;
    width: 100%; min-height: 80px; padding: 14px 20px; background-color: #ffffff;
    border: 4px solid #38bdf8; border-radius: 20px; text-decoration: none; color: #0f172a;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.12); transition: transform 0.15s;
  }
  .menu-btn:active { transform: scale(0.97); background-color: #e0f2fe; }
  .btn-icon-wrapper {
    width: 54px; height: 54px; border-radius: 14px; background-color: #e0f2fe;
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin-right: 16px; flex-shrink: 0;
  }
  .btn-text { font-size: 22px; font-weight: bold; }
</style>
</head>
<body>

<header>
  <h1>🎮 數學學習遊戲</h1>
  <p>點擊圖案開始練習！</p>
</header>

<div class="menu-grid">
  <!-- 面積主題 1 -->
  <a href="games/area-concept.html" class="menu-btn">
    <div class="btn-icon-wrapper">🎨</div>
    <div class="btn-text">認識面積的概念</div>
  </a>

  <!-- 面積主題 2 -->
  <a href="games/area-compare-visual.html" class="menu-btn">
    <div class="btn-icon-wrapper">📐</div>
    <div class="btn-text">直觀比較平面圖形的面</div>
  </a>

  <!-- 面積主題 3 -->
  <a href="games/area-compare-direct.html" class="menu-btn">
    <div class="btn-icon-wrapper">🟣</div>
    <div class="btn-text">直接比較平面圖形的面積</div>
  </a>

  <!-- 面積主題 4 -->
  <a href="games/area-learning.html" class="menu-btn">
    <div class="btn-icon-wrapper">🟥</div>
    <div class="btn-text">面積：長方形與正方形面積</div>
  </a>

  <!-- 數數 -->
  <a href="games/number-counting.html" class="menu-btn">
    <div class="btn-icon-wrapper">🔢</div>
    <div class="btn-text">數數與數量配對</div>
  </a>

  <!-- 配對遊戲 -->
  <a href="games/number-matching-v10.html" class="menu-btn">
    <div class="btn-icon-wrapper">🧩</div>
    <div class="btn-text">配對遊戲</div>
  </a>
</div>
