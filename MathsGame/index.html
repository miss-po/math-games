<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>特教數學學習遊戲選單</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; min-height: 100dvh; margin: 0; padding: 16px; padding-bottom: 40px;
    font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
    background-color: #f0f9ff; display: flex; flex-direction: column; align-items: center;
    overflow-y: auto; /* 確保超出螢幕時可以順暢滾動 */
    -webkit-overflow-scrolling: touch;
  }
  header { width: 100%; max-width: 700px; text-align: center; margin-bottom: 16px; }
  h1 { font-size: clamp(24px, 5vw, 32px); color: #0284c7; margin: 0 0 6px 0; }
  p { font-size: clamp(16px, 3.5vw, 18px); color: #475569; margin: 0 0 16px 0; font-weight: bold; }
  
  /* Filter Dropdown Styling */
  .filter-container {
    width: 100%; max-width: 700px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .filter-label { font-size: 18px; font-weight: bold; color: #0369a1; }
  select {
    padding: 10px 16px; font-size: 18px; font-weight: bold; color: #0f172a;
    background-color: #ffffff; border: 3px solid #38bdf8; border-radius: 14px;
    outline: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }

  .menu-grid { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; }
  
  .menu-btn {
    display: flex; align-items: center; justify-content: flex-start;
    width: 100%; min-height: 72px; padding: 12px 18px; background-color: #ffffff;
    border: 4px solid #38bdf8; border-radius: 20px; text-decoration: none; color: #0f172a;
    box-shadow: 0 4px 10px rgba(14, 165, 233, 0.12); transition: transform 0.15s;
    cursor: pointer;
  }
  .menu-btn:active { transform: scale(0.98); background-color: #e0f2fe; }

  .btn-icon-wrapper {
    width: 48px; height: 48px; border-radius: 12px; background-color: #e0f2fe;
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin-right: 14px; flex-shrink: 0;
  }
  .btn-text { font-size: clamp(18px, 4vw, 22px); font-weight: bold; flex-grow: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🎮 數學學習遊戲</h1>
  <p>點擊主題開始練習！</p>
</header>

<div class="filter-container">
  <span class="filter-label">篩選主題：</span>
  <select id="categoryFilter" onchange="filterGames()">
    <option value="all">🌟 顯示所有遊戲</option>
    <option value="spatial">🧭 方位與空間</option>
    <option value="area">📐 面積單元</option>
    <option value="multiply">✖️ 乘法單元</option>
    <option value="division">🔀 除法單元</option>
    <option value="counting">🔢 數數與配對</option>
  </select>
</div>

<div class="menu-grid">
  <!-- Spatial & Direction Games -->
  <a href="games/direction-learning.html" class="menu-btn" data-category="spatial" style="border-color: #22c55e;">
    <div class="btn-icon-wrapper" style="background-color: #dcfce7;">🧭</div>
    <div class="btn-text" style="color: #15803d;">方向與空間學習遊戲</div>
  </a>

  <!-- Area Games -->
  <a href="games/area-learning.html" class="menu-btn" data-category="area">
    <div class="btn-icon-wrapper">🟩</div>
    <div class="btn-text">面積基礎學習</div>
  </a>

  <a href="games/area-concept.html" class="menu-btn" data-category="area">
    <div class="btn-icon-wrapper">🎨</div>
    <div class="btn-text">認識面積的概念</div>
  </a>

  <a href="games/area-compare-visual.html" class="menu-btn" data-category="area">
    <div class="btn-icon-wrapper">📐</div>
    <div class="btn-text">直觀比較平面圖形的面</div>
  </a>

  <a href="games/area-compare-direct.html" class="menu-btn" data-category="area">
    <div class="btn-icon-wrapper">🟣</div>
    <div class="btn-text">直接比較平面圖形的面積</div>
  </a>

  <a href="games/area-adventure.html" class="menu-btn" data-category="area" style="border-color: #10b981;">
    <div class="btn-icon-wrapper" style="background-color: #d1fae5;">🟥</div>
    <div class="btn-text" style="color: #047857;">圖形面積大冒險</div>
  </a>

  <!-- Multiplication Games -->
  <a href="games/multiply-magic.html" class="menu-btn" data-category="multiply" style="border-color: #f59e0b;">
    <div class="btn-icon-wrapper" style="background-color: #fef3c7;">🧪</div>
    <div class="btn-text" style="color: #b45309;">乘法魔法屋</div>
  </a>

  <a href="games/multiplication-concept.html" class="menu-btn" data-category="multiply" style="border-color: #eab308;">
    <div class="btn-icon-wrapper" style="background-color: #fef08a;">✖️</div>
    <div class="btn-text" style="color: #854d0e;">乘法等組大冒險</div>
  </a>

  <!-- Division Games -->
  <a href="games/division-concept.html" class="menu-btn" data-category="division" style="border-color: #0284c7;">
    <div class="btn-icon-wrapper" style="background-color: #bae6fd;">🔀</div>
    <div class="btn-text" style="color: #0369a1;">除法平分大冒險</div>
  </a>

  <!-- Counting and Matching Games -->
  <a href="games/number-counting.html" class="menu-btn" data-category="counting">
    <div class="btn-icon-wrapper">🔢</div>
    <div class="btn-text">數數與數量配對</div>
  </a>

  <a href="games/number-matching-v10.html" class="menu-btn" data-category="counting">
    <div class="btn-icon-wrapper">🧩</div>
    <div class="btn-text">配對遊戲</div>
  </a>

  <a href="games/logic-codebreaker.html" class="menu-btn" data-category="counting">
    <div class="btn-icon-wrapper">🧠</div>
    <div class="btn-text">邏輯解密大挑戰</div> 
  </a>
</div>

<script>
  function filterGames() {
    const filter = document.getElementById('categoryFilter').value;
    const buttons = document.querySelectorAll('.menu-btn');
    buttons.forEach(btn => {
      if (filter === 'all' || btn.dataset.category === filter) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    });
  }
</script>

</body>
</html>
