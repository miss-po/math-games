<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>認識面積的概念 - 填滿並選擇面積</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; margin: 0; padding: 6px 12px;
    font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
    background-color: #f0f9ff; display: flex; flex-direction: column; align-items: center; 
    justify-content: space-between; overflow: hidden;
  }
  
  header {
    width: 100%; max-width: 980px; height: 48px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; background: #ffffff; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); flex-shrink: 0;
  }
  .back-btn { font-size: 16px; font-weight: bold; color: #0284c7; text-decoration: none; padding: 4px 12px; background: #e0f2fe; border-radius: 10px; }
  h1 { font-size: 20px; margin: 0; color: #0284c7; font-weight: bold; }
  
  .progress-container { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: bold; color: #475569; }
  .progress-dot { width: 28px; height: 28px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; }
  .progress-dot.active { background: #0284c7; }

  #instruction-box {
    font-size: clamp(18px, 2.5vh, 24px); font-weight: bold; color: #0f172a; background: #e0f2fe; padding: 6px 20px;
    border-radius: 14px; margin: 4px 0; border: 3px solid #38bdf8; text-align: center; flex-shrink: 0;
  }
  .highlight-word { font-size: 1.2em; color: #0284c7; display: inline-block; vertical-align: middle; margin: 0 4px; font-weight: 900; }

  #game-container {
    width: 100%; max-width: 980px; flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 12px; min-height: 0; overflow: hidden;
  }

  /* 精確劃分的網格區域 */
  .canvas-wrapper {
    position: relative;
    display: inline-block;
    box-sizing: content-box;
  }

  .grid-matrix {
    display: grid;
    gap: 0;
    position: relative;
    z-index: 2;
  }

  .grid-cell {
    border: 2px solid #94a3b8;
    background-color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    color: #ffffff;
    box-sizing: border-box;
    margin: 0;
    transition: background-color 0.15s ease;
  }

  .grid-cell.filled {
    background-color: #0284c7;
    border-color: #0369a1;
  }

  .empty-cell {
    visibility: hidden;
    pointer-events: none;
    border: none !important;
  }

  /* 圍繞圖形外圍貼合黑邊框 */
  .shape-outline-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* 選擇答案區域 */
  #answer-area {
    display: flex;
    gap: 20px;
    margin-top: 6px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-btn {
    width: 140px;
    height: 100px;
    font-size: 52px;
    font-weight: bold;
    background-color: #ffffff;
    color: #0284c7;
    border: 4px solid #0284c7;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(2, 132, 199, 0.25);
    transition: transform 0.1s, background-color 0.1s;
  }

  .option-btn:active {
    transform: scale(0.92);
  }

  .wrong-answer {
    animation: flashShake 0.6s ease-in-out 1;
  }

  @keyframes flashShake {
    0% { transform: translateX(0); border-color: #ef4444; background-color: #fee2e2; color: #ef4444; }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); border-color: #0284c7; background-color: #ffffff; color: #0284c7; }
  }

  #success-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: none; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.4); z-index: 999; pointer-events: none;
  }
  .green-tick {
    font-size: 180px; color: #22c55e;
    text-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
    animation: popScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes popScale {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  #reward-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
    display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
  }
  .reward-content { background: white; padding: 40px 50px; border-radius: 25px; text-align: center; }
  .hand-icon { font-size: 100px; margin-bottom: 10px; animation: waveHand 1s infinite alternate ease-in-out; }
  @keyframes waveHand { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .btn-restart { padding: 16px 36px; font-size: 26px; background-color: #0284c7; color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3); margin-top: 15px; }
  .btn-restart:active { transform: scale(0.95); }
</style>
</head>
<body>

<header>
  <a href="../index.html" class="back-btn">🏠 主選單</a>
  <h1>認識面積的概念</h1>
  <div class="progress-container">
    <span>進度：</span>
    <div class="progress-dot" id="dot-1">1</div>
    <div class="progress-dot" id="dot-2">2</div>
    <div class="progress-dot" id="dot-3">3</div>
    <div class="progress-dot" id="dot-4">4</div>
    <div class="progress-dot" id="dot-5">5</div>
    <div class="progress-dot" id="dot-6">6</div>
  </div>
</header>

<div id="instruction-box">請<span class="highlight-word">逐個格仔點擊</span>，把圖形填滿</div>

<div id="game-container"></div>

<div id="success-overlay"><div class="green-tick">✔</div></div>

<div id="reward-modal">
  <div class="reward-content">
    <div class="hand-icon">🙋‍♂️</div>
    <h2 style="font-size: 36px; color: #0284c7; margin: 12px 0;">你完成了！舉手等候老師</h2>
    <button class="btn-restart" onclick="restartGame()">重新開始 🔄</button>
  </div>
</div>

<script>
  const levels = [
    {
      name: "3x3 正方形",
      options: [7, 9, 8],
      map: [
        [1, 1, 1],
        [1, 1, 1],
        [1, 1, 1]
      ]
    },
    {
      name: "4x2 長方形",
      options: [6, 8, 10],
      map: [
        [1, 1, 1, 1],
        [1, 1, 1, 1]
      ]
    },
    {
      name: "L 型圖形",
      options: [4, 5, 6],
      map: [
        [1, 0, 0],
        [1, 0, 0],
        [1, 1, 1]
      ]
    },
    {
      name: "T 型圖形",
      options: [5, 6, 7],
      map: [
        [1, 1, 1],
        [0, 1, 0],
        [0, 1, 0]
      ]
    },
    {
      name: "階梯型",
      options: [5, 6, 7],
      map: [
        [1, 0, 0],
        [1, 1, 0],
        [1, 1, 1]
      ]
    },
    {
      name: "十字型圖形",
      options: [4, 5, 6],
      map: [
        [0, 1, 0],
        [1, 1, 1],
        [0, 1, 0]
      ]
    }
  ];

  let currentStep = 0;
  let filledCount = 0;
  let totalCells = 0;
  let isChecking = false;
  let isFilledComplete = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playClickSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(400 + (filledCount * 30), audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (type === 'fail') {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'success') {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'complete') {
      [523, 659, 783, 1046].forEach((freq, idx) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); o.connect(audioCtx.destination); o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        o.start(audioCtx.currentTime + idx * 0.1); o.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
      });
    }
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'zh-HK'; msg.rate = 0.85;
      window.speechSynthesis.speak(msg);
    }
  }

  function generateOutlinePath(map, cSize) {
    const rows = map.length;
    const cols = map[0].length;
    let pathD = "";

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (map[r][c] === 1) {
          const x = c * cSize;
          const y = r * cSize;
          if (r === 0 || map[r - 1][c] === 0) pathD += `M ${x} ${y} L ${x + cSize} ${y} `;
          if (r === rows - 1 || map[r + 1][c] === 0) pathD += `M ${x} ${y + cSize} L ${x + cSize} ${y + cSize} `;
          if (c === 0 || map[r][c - 1] === 0) pathD += `M ${x} ${y} L ${x} ${y + cSize} `;
          if (c === cols - 1 || map[r][c + 1] === 0) pathD += `M ${x + cSize} ${y} L ${x + cSize} ${y + cSize} `;
        }
      }
    }
    return pathD;
  }

  /* 動態自適應計算最合適的 cellSize 與 按鈕大小 */
  function calculateBestCellSize(rows, cols) {
    const container = document.getElementById('game-container');
    const availW = container.clientWidth * 0.95;
    // 扣除答案選區高度（預設為 110px）及間距
    const availH = (container.clientHeight - 130) * 0.92;

    const maxWCell = Math.floor(availW / cols);
    const maxHCell = Math.floor(availH / rows);

    // 大幅放大的同時，受限於可用視窗大小以防滾動
    let size = Math.min(maxWCell, maxHCell);
    return Math.max(75, Math.min(size, 145));
  }

  function renderLevel() {
    isChecking = false;
    isFilledComplete = false;
    filledCount = 0;
    const lvl = levels[currentStep];
    const container = document.getElementById('game-container');
    const instruction = document.getElementById('instruction-box');
    
    instruction.innerHTML = `請<span class="highlight-word">逐個格仔點擊</span>，把圖形填滿`;

    for(let i=1; i<=levels.length; i++) {
      const dot = document.getElementById(`dot-${i}`);
      if(dot) dot.classList.toggle('active', i <= currentStep + 1);
    }

    const rows = lvl.map.length;
    const cols = lvl.map[0].length;
    const cSize = calculateBestCellSize(rows, cols);
    const fontSize = Math.floor(cSize * 0.45);
    
    let cellsHtml = '';
    totalCells = 0;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (lvl.map[r][c] === 1) {
          totalCells++;
          cellsHtml += `<div class="grid-cell" style="width:${cSize}px; height:${cSize}px; font-size:${fontSize}px;" onclick="clickCell(this)"></div>`;
        } else {
          cellsHtml += `<div class="empty-cell" style="width:${cSize}px; height:${cSize}px;"></div>`;
        }
      }
    }

    const pathD = generateOutlinePath(lvl.map, cSize);
    const totalW = cols * cSize;
    const totalH = rows * cSize;

    container.innerHTML = `
      <div class="canvas-wrapper" style="width:${totalW}px; height:${totalH}px;">
        <div class="grid-matrix" style="
          grid-template-columns: repeat(${cols}, ${cSize}px);
          grid-template-rows: repeat(${rows}, ${cSize}px);
        ">
          ${cellsHtml}
        </div>
        <svg class="shape-outline-svg" viewBox="0 0 ${totalW} ${totalH}">
          <path d="${pathD}" stroke="#0f172a" stroke-width="5" stroke-linecap="square" fill="none" />
        </svg>
      </div>
      <div id="answer-area"></div>
    `;

    if(currentStep === 0) speak("請逐個格仔點擊，把圖形填滿");
  }

  function clickCell(el) {
    if (isChecking || el.classList.contains('filled')) return;

    filledCount++;
    el.classList.add('filled');
    el.innerText = filledCount;
    playClickSound();

    if (filledCount === totalCells) {
      isFilledComplete = true;
      showAnswerOptions();
    }
  }

  function showAnswerOptions() {
    const lvl = levels[currentStep];
    const instruction = document.getElementById('instruction-box');
    instruction.innerHTML = `這個圖形的面積是多少格？<span class="highlight-word">請選擇答案</span>`;
    speak("這個圖形的面積是多少格？請選擇答案");

    const answerArea = document.getElementById('answer-area');
    let btnsHtml = '';
    lvl.options.forEach(opt => {
      btnsHtml += `<button class="option-btn" onclick="checkChoice(${opt}, this)">${opt}</button>`;
    });
    answerArea.innerHTML = btnsHtml;
  }

  function checkChoice(val, el) {
    if(isChecking) return;

    if (val === totalCells) {
      isChecking = true;
      triggerSuccessOverlay(() => {
        currentStep++;
        if(currentStep >= levels.length) {
          playSound('complete');
          document.getElementById('reward-modal').style.display = 'flex';
          speak("你完成了！舉手等候老師");
        } else {
          renderLevel();
        }
      });
    } else {
      isChecking = true;
      playSound('fail');
      el.classList.add('wrong-answer');
      speak("再數一次看看！");
      setTimeout(() => {
        el.classList.remove('wrong-answer');
        isChecking = false;
      }, 650);
    }
  }

  function triggerSuccessOverlay(callback) {
    playSound('success');
    const overlay = document.getElementById('success-overlay');
    overlay.style.display = 'flex';
    setTimeout(() => {
      overlay.style.display = 'none';
      if(callback) callback();
    }, 600);
  }

  function restartGame() {
    document.getElementById('reward-modal').style.display = 'none';
    currentStep = 0;
    renderLevel();
  }

  let resizeTimer;
  window.onresize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderLevel(), 150);
  };

  window.onload = () => renderLevel();
</script>
</body>
</html>
