<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>圖形面積大冒險</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    width: 100vw; height: 100dvh; margin: 0; padding: 8px;
    font-family: system-ui, -apple-system, 'Comic Sans MS', sans-serif;
    background-color: #f0fdf4; display: flex; flex-direction: column; align-items: center; overflow: hidden;
  }
  .game-container { width: 100%; max-width: 650px; height: 100%; display: flex; flex-direction: column; gap: 6px; position: relative; }

  /* Header Controls */
  .header {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: #ffffff; padding: 6px 10px; border-radius: 14px; border: 3px solid #bbf7d0; flex-wrap: wrap;
  }
  .back-btn {
    background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 10px;
    font-size: 13px; font-weight: bold; text-decoration: none; box-shadow: 0 3px 0 #b91c1c; white-space: nowrap;
  }
  
  .mode-select {
    background: #dcfce7; color: #15803d; border: 2px solid #86efac; padding: 5px 8px;
    border-radius: 10px; font-weight: bold; font-size: 13px; outline: none; cursor: pointer; flex: 1; max-width: 210px;
  }
  
  .tips-btn {
    background: #fef08a; color: #854d0e; border: 2px solid #fde047; padding: 5px 10px;
    border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 2px 0 #ca8a04;
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .tips-btn:active { transform: translateY(1px); box-shadow: none; }

  .progress-container { display: flex; align-items: center; gap: 4px; font-weight: bold; font-size: 12px; color: #166534; }
  .progress-dot {
    width: 20px; height: 20px; border-radius: 50%; background: #e2e8f0; border: 2px solid #cbd5e1;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #64748b; font-weight: bold;
  }
  .progress-dot.active { background: #bbf7d0; border-color: #22c55e; color: #15803d; }
  .progress-dot.completed { background: #22c55e; border-color: #15803d; color: white; }

  /* Canvas Main Stage */
  .canvas-card {
    flex: 1; min-height: 120px; background: #ffffff; border: 3px solid #86efac;
    border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; position: relative;
  }
  canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* Popup Formula Tips Overlay */
  .tips-card {
    position: absolute; top: 8px; left: 8px; right: 8px; z-index: 15;
    background: #fffbeb; border: 3px solid #fde047; border-radius: 14px; padding: 10px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18); animation: fadeIn 0.2s ease;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .tips-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #854d0e; font-size: 14px; }
  .close-tips-btn { background: #fef08a; border: 1px solid #ca8a04; color: #854d0e; border-radius: 6px; padding: 2px 8px; font-weight: bold; cursor: pointer; }
  .tips-body { width: 100%; font-size: 13px; color: #713f12; line-height: 1.4; text-align: center; }
  .tips-formula { background: #fef9c3; border-left: 4px solid #eab308; padding: 4px 8px; margin: 4px 0; font-weight: bold; font-size: 14px; border-radius: 4px; display: inline-block; }
  .tips-canvas-container { width: 100%; height: 90px; display: flex; justify-content: center; align-items: center; }

  /* Input Card Section */
  .input-card {
    background: #ffffff; border: 3px solid #86efac; border-radius: 16px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; align-items: center;
  }

  .stacked-inputs { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; }
  .input-row { display: flex; flex-direction: column; gap: 2px; }
  .input-label { font-size: 12px; font-weight: bold; color: #166534; }
  
  .display-field {
    width: 100%; height: 36px; font-size: 17px; font-weight: bold;
    text-align: center; border: 2px solid #cbd5e1; border-radius: 10px; background: #f8fafc;
    display: flex; align-items: center; justify-content: center; color: #0f172a; position: relative;
  }
  .display-field.active { border-color: #22c55e; background: #ffffff; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
  .display-field.locked { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
  
  .tick-mark { position: absolute; right: 10px; font-size: 18px; color: #16a34a; font-weight: bold; }

  /* Upgraded 5-Column Keypad (Adjacent Unit Buttons) */
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 380px; }
  .key-btn {
    height: 36px; font-size: 15px; font-weight: bold; color: #0f172a; background: #e2e8f0;
    border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 3px 0 #cbd5e1;
    display: flex; align-items: center; justify-content: center;
  }
  .key-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #cbd5e1; }
  .key-btn.action { background: #3b82f6; color: white; box-shadow: 0 3px 0 #1d4ed8; }
  .key-btn.unit { background: #f59e0b; color: white; box-shadow: 0 3px 0 #b45309; }
  .key-btn.submit { background: #22c55e; color: white; box-shadow: 0 3px 0 #15803d; }

  .mcq-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 360px; }
  .mcq-btn {
    height: 46px; font-size: 18px; font-weight: bold; background: #dcfce7; color: #14532d;
    border: 3px solid #4ade80; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #16a34a;
  }
  .mcq-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #16a34a; }

  .feedback { font-size: 13px; font-weight: bold; min-height: 18px; text-align: center; }
  .correct { color: #16a34a; }
  .wrong { color: #dc2626; }
  .hidden { display: none !important; }

  /* Overlays */
  .big-tick-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.88);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    border-radius: 16px; z-index: 20; animation: fadeIn 0.2s ease;
  }
  .big-tick-icon {
    font-size: 90px; color: #16a34a; line-height: 1;
    animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .big-tick-text { font-size: 22px; font-weight: bold; color: #15803d; margin-top: 8px; }

  .modal-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    justify-content: center; align-items: center; border-radius: 16px; z-index: 30;
  }
  .modal-content {
    background: white; border-radius: 20px; padding: 20px; text-align: center;
    border: 4px solid #22c55e; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: bouncePop 0.4s ease;
  }
  .modal-title { font-size: 22px; color: #15803d; font-weight: bold; margin-bottom: 8px; }
  .modal-btn {
    margin-top: 12px; background: #22c55e; color: white; border: none; padding: 8px 20px;
    font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #15803d;
  }

  @keyframes bouncePop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <a href="../index.html" class="back-btn">🏠 主選單</a>
    
    <!-- Level Selector Dropdown -->
    <select id="modeSelect" class="mode-select" onchange="changeMode(this.value)">
      <option value="1">關卡 1: 有格仔 (選擇題)</option>
      <option value="2">關卡 2: 有格仔 (填空題)</option>
      <option value="3">關卡 3: 無格仔 (選擇題)</option>
      <option value="4">關卡 4: 無格仔 (填空題)</option>
      <option value="5">關卡 5: 三角形面積</option>
      <option value="6">關卡 6: 梯形面積</option>
    </select>

    <!-- Formula Tips Button -->
    <button class="tips-btn" onclick="toggleTips()">💡 提示</button>

    <div class="progress-container">
      <span>進度：</span>
      <div class="progress-dot" id="dot-1">1</div>
      <div class="progress-dot" id="dot-2">2</div>
      <div class="progress-dot" id="dot-3">3</div>
      <div class="progress-dot" id="dot-4">4</div>
      <div class="progress-dot" id="dot-5">5</div>
      <div class="progress-dot" id="dot-6">6</div>
    </div>
  </div>

  <div class="canvas-card">
    <!-- Tips Overlay Box with Mini Diagram -->
    <div class="tips-card hidden" id="tipsCard">
      <div class="tips-header">
        <span>💡 簡明公式提示</span>
        <button class="close-tips-btn" onclick="toggleTips()">關閉 ✖</button>
      </div>
      <div class="tips-body" id="tipsContent"></div>
      <div class="tips-canvas-container">
        <canvas id="tipsCanvas" width="220" height="85"></canvas>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gridCanvas"></canvas>
  </div>

  <div class="input-card">
    <div class="stacked-inputs" id="inputSection">
      <div class="input-row">
        <div class="input-label" id="labelEq">步驟 1: 請輸入算式 (長 × 寬)</div>
        <div class="display-field active" id="fieldEq">
          <span id="textEq"></span>
          <span class="tick-mark hidden" id="tickEq">✔</span>
        </div>
      </div>

      <div class="input-row hidden" id="rowAns">
        <div class="input-label">步驟 2: 請輸入面積與單位 (例如: 12 cm²)</div>
        <div class="display-field active" id="fieldAns">
          <span id="textAns"></span>
        </div>
      </div>
    </div>

    <!-- Upgraded Keypad: Unit buttons (cm², m²) placed side-by-side -->
    <div class="keypad" id="keypad">
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn action" onclick="pressKey(' × ')">×</button>
      <button class="key-btn action" onclick="pressKey(' ÷ ')">÷</button>
      
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn action" onclick="pressKey(' + ')">+</button>
      <button class="key-btn action" onclick="pressKey('(')">(</button>
      
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn action" onclick="pressKey(')')">)</button>
      <button class="key-btn action" onclick="pressDelete()">⌫</button>
      
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <!-- Adjacent Unit Buttons -->
      <button class="key-btn unit" onclick="pressKey(' cm²')">cm²</button>
      <button class="key-btn unit" onclick="pressKey(' m²')">m²</button>
      <button class="key-btn submit" onclick="submitStep()" style="grid-column: span 2;">確認送出</button>
    </div>

    <div class="mcq-container hidden" id="mcqContainer"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- Big Checkmark Success Overlay -->
  <div class="big-tick-overlay hidden" id="bigTickOverlay">
    <div class="big-tick-icon">✔</div>
    <div class="big-tick-text" id="bigTickText">答對了！</div>
  </div>

  <!-- Stage Victory Banner -->
  <div class="modal-overlay hidden" id="levelModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">🎉 恭喜晉級！</div>
      <p id="modalDesc" style="font-size:15px; font-weight:bold; color:#475569;">你已成功通過此關卡！</p>
      <button class="modal-btn" onclick="closeModal()">進入下一關 🚀</button>
    </div>
  </div>
</div>

<script>
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
  }

  function playSound(type) {
    initAudio();
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.setValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'levelup') {
      osc.type = 'triangle';
      const notes = [440, 554.37, 659.25, 880];
      notes.forEach((freq, i) => {
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
      });
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    }
  }

  let mode = 1; // 1 to 6
  let currentQIndex = 1; // 1 to 6
  let currentStep = 1; // 1: Formula, 2: Answer
  let valEq = '';
  let valAns = '';
  let currentQ = {};

  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');

  function changeMode(selectedMode) {
    mode = parseInt(selectedMode);
    currentQIndex = 1;
    document.getElementById('tipsCard').classList.add('hidden');
    initQuestion();
  }

  function toggleTips() {
    const tipsCard = document.getElementById('tipsCard');
    tipsCard.classList.toggle('hidden');
    if (!tipsCard.classList.contains('hidden')) {
      updateTipsContent();
      drawTipsDiagram();
    }
  }

  function updateTipsContent() {
    const container = document.getElementById('tipsContent');
    if (mode >= 1 && mode <= 4) {
      container.innerHTML = `
        <div class="tips-formula">長方形面積 = 長 × 寬</div>
        <div>用<b>長</b>乘以<b>寬</b>即可算出面積。留意單位寫法（如 cm² 或 m²）。</div>
      `;
    } else if (mode === 5) {
      container.innerHTML = `
        <div class="tips-formula">三角形面積 = 底 × 高 ÷ 2</div>
        <div>找出互相垂直的<b>底</b>與<b>高</b>（紅虛線），乘完後<b>切記要 ÷ 2</b>！</div>
      `;
    } else if (mode === 6) {
      container.innerHTML = `
        <div class="tips-formula">梯形面積 = (上底 + 下底) × 高 ÷ 2</div>
        <div>把<b>上底與下底</b>加起來，乘以<b>高</b>，最後<b>切記要 ÷ 2</b>！</div>
      `;
    }
  }

  function drawTipsDiagram() {
    const tCanvas = document.getElementById('tipsCanvas');
    const tCtx = tCanvas.getContext('2d');
    tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);

    tCtx.font = 'bold 12px system-ui';
    tCtx.textAlign = 'center';
    tCtx.textBaseline = 'middle';

    if (mode >= 1 && mode <= 4) {
      // Rect Diagram
      const w = 120, h = 50, x = (tCanvas.width - w)/2, y = (tCanvas.height - h)/2 + 5;
      tCtx.fillStyle = '#e0f2fe';
      tCtx.fillRect(x, y, w, h);
      tCtx.strokeStyle = '#0284c7';
      tCtx.lineWidth = 2;
      tCtx.strokeRect(x, y, w, h);

      tCtx.fillStyle = '#0284c7';
      tCtx.fillText('長', x + w/2, y - 10);
      tCtx.fillText('寬', x + w + 12, y + h/2);

    } else if (mode === 5) {
      // Triangle Diagram
      const baseW = 120, triH = 50;
      const x = (tCanvas.width - baseW)/2, y = (tCanvas.height - triH)/2 + 10;
      const topX = x + 45;

      tCtx.beginPath();
      tCtx.moveTo(x, y + triH);
      tCtx.lineTo(x + baseW, y + triH);
      tCtx.lineTo(topX, y);
      tCtx.closePath();
      tCtx.fillStyle = '#e0f2fe';
      tCtx.fill();
      tCtx.strokeStyle = '#0284c7';
      tCtx.lineWidth = 2;
      tCtx.stroke();

      // Dashed Height Line
      tCtx.beginPath();
      tCtx.setLineDash([3, 3]);
      tCtx.strokeStyle = '#dc2626';
      tCtx.moveTo(topX, y);
      tCtx.lineTo(topX, y + triH);
      tCtx.stroke();
      tCtx.setLineDash([]);

      tCtx.fillStyle = '#0284c7';
      tCtx.fillText('底', x + baseW/2, y + triH + 10);
      tCtx.fillStyle = '#dc2626';
      tCtx.fillText('高', topX - 12, y + triH/2);

    } else if (mode === 6) {
      // Trapezoid Diagram
      const bW = 130, aW = 70, trapH = 45;
      const startX = (tCanvas.width - bW)/2, startY = (tCanvas.height - trapH)/2 + 8;
      const topX = startX + (bW - aW)/2;

      tCtx.beginPath();
      tCtx.moveTo(startX, startY + trapH);
      tCtx.lineTo(startX + bW, startY + trapH);
      tCtx.lineTo(topX + aW, startY);
      tCtx.lineTo(topX, startY);
      tCtx.closePath();
      tCtx.fillStyle = '#e0f2fe';
      tCtx.fill();
      tCtx.strokeStyle = '#0284c7';
      tCtx.lineWidth = 2;
      tCtx.stroke();

      // Dashed Height
      tCtx.beginPath();
      tCtx.setLineDash([3, 3]);
      tCtx.strokeStyle = '#dc2626';
      tCtx.moveTo(topX, startY);
      tCtx.lineTo(topX, startY + trapH);
      tCtx.stroke();
      tCtx.setLineDash([]);

      tCtx.fillStyle = '#0284c7';
      tCtx.fillText('上底', topX + aW/2, startY - 8);
      tCtx.fillText('下底', startX + bW/2, startY + trapH + 10);
      tCtx.fillStyle = '#dc2626';
      tCtx.fillText('高', topX - 12, startY + trapH/2);
    }
  }

  function updateDots() {
    for (let i = 1; i <= 6; i++) {
      const dot = document.getElementById(`dot-${i}`);
      dot.className = 'progress-dot';
      if (i < currentQIndex) dot.classList.add('completed');
      else if (i === currentQIndex) dot.classList.add('active');
    }
  }

  function initQuestion() {
    currentStep = 1;
    valEq = ''; valAns = '';
    updateDots();

    document.getElementById('modeSelect').value = mode;
    document.getElementById('tickEq').classList.add('hidden');
    document.getElementById('fieldEq').className = 'display-field active';
    document.getElementById('rowAns').classList.add('hidden');
    document.getElementById('fieldAns').className = 'display-field active';
    document.getElementById('feedback').innerText = '';

    const labelEq = document.getElementById('labelEq');
    if (mode === 5) {
      labelEq.innerText = '步驟 1: 請輸入算式 (底 × 高 ÷ 2)';
    } else if (mode === 6) {
      labelEq.innerText = '步驟 1: 請輸入算式 ((上底 + 下底) × 高 ÷ 2)';
    } else {
      labelEq.innerText = '步驟 1: 請輸入算式 (長 × 寬)';
    }

    let unit = Math.random() > 0.5 ? 'cm' : 'm';
    const showDistractors = (currentQIndex >= 4) && (mode >= 3); // Extra labels for Q4-Q6 in modes 3,4,5,6

    if (mode >= 1 && mode <= 4) {
      let w = Math.floor(Math.random() * 5) + 2;
      let h = Math.floor(Math.random() * 5) + 2;
      currentQ = {
        shape: 'rect', w: w, h: h, unit: unit,
        totalArea: w * h,
        showExtraLabels: showDistractors,
        validEqs: [`${w}x${h}`, `${h}x${w}`],
        validAnsNum: w * h,
        validUnitStr: `${unit}²`
      };
    } else if (mode === 5) { // Triangle
      let w = Math.floor(Math.random() * 6) + 3; // base
      let h = Math.floor(Math.random() * 5) + 2; // height
      if ((w * h) % 2 !== 0) w++; 
      let area = (w * h) / 2;

      // Distractor side lengths
      let side1 = Math.floor(Math.sqrt(h*h + 4)) + 1;
      let side2 = Math.floor(Math.sqrt(h*h + (w-2)*(w-2))) + 1;

      currentQ = {
        shape: 'triangle', w: w, h: h, unit: unit,
        side1: side1, side2: side2,
        totalArea: area,
        showExtraLabels: showDistractors,
        validEqs: [
          `${w}x${h}/2`, `${h}x${w}/2`,
          `(${w}x${h})/2`, `(${h}x${w})/2`,
          `${w}x${h}÷2`, `${h}x${w}÷2`,
          `(${w}x${h})÷2`, `(${h}x${w})÷2`
        ],
        validAnsNum: area,
        validUnitStr: `${unit}²`
      };
    } else if (mode === 6) { // Trapezoid
      let a = Math.floor(Math.random() * 4) + 2; // top base
      let b = Math.floor(Math.random() * 4) + 6; // bottom base
      let h = Math.floor(Math.random() * 4) + 2; // height
      if (((a + b) * h) % 2 !== 0) h++;
      let area = ((a + b) * h) / 2;

      // Distractor slant side lengths
      let side1 = h + 1;
      let side2 = h + 2;

      currentQ = {
        shape: 'trapezoid', a: a, b: b, h: h, unit: unit,
        side1: side1, side2: side2,
        totalArea: area,
        showExtraLabels: showDistractors,
        validEqs: [
          `(${a}+${b})x${h}/2`, `(${b}+${a})x${h}/2`,
          `(${a}+${b})x${h}÷2`, `(${b}+${a})x${h}÷2`,
          `((${a}+${b})x${h})/2`, `((${b}+${a})x${h})/2`,
          `${h}x(${a}+${b})/2`, `${h}x(${b}+${a})/2`,
          `${h}x(${a}+${b})÷2`, `${h}x(${b}+${a})÷2`
        ],
        validAnsNum: area,
        validUnitStr: `${unit}²`
      };
    }

    const keypad = document.getElementById('keypad');
    const mcq = document.getElementById('mcqContainer');
    const inputSection = document.getElementById('inputSection');

    if (mode === 1 || mode === 3) {
      inputSection.classList.add('hidden');
      keypad.classList.add('hidden');
      mcq.classList.remove('hidden');
      renderMCQOptions();
    } else {
      inputSection.classList.remove('hidden');
      keypad.classList.remove('hidden');
      mcq.classList.add('hidden');
    }

    updateDisplayFields();
    drawShape();
  }

  function drawShape() {
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth - 10;
    canvas.height = parent.clientHeight - 10;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const padding = 50;

    if (mode >= 1 && mode <= 4) {
      const scale = Math.min((canvas.width - padding * 2) / currentQ.w, (canvas.height - padding * 2) / currentQ.h);
      const rectW = currentQ.w * scale;
      const rectH = currentQ.h * scale;
      const startX = (canvas.width - rectW) / 2;
      const startY = (canvas.height - rectH) / 2;

      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(startX, startY, rectW, rectH);

      // Grid for Mode 1 and Mode 2
      if (mode === 1 || mode === 2) {
        ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 1.5;
        for (let i = 0; i <= currentQ.w; i++) {
          ctx.beginPath(); ctx.moveTo(startX + i * scale, startY); ctx.lineTo(startX + i * scale, startY + rectH); ctx.stroke();
        }
        for (let j = 0; j <= currentQ.h; j++) {
          ctx.beginPath(); ctx.moveTo(startX, startY + j * scale); ctx.lineTo(startX + rectW, startY + j * scale); ctx.stroke();
        }
      }

      ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3;
      ctx.strokeRect(startX, startY, rectW, rectH);

      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      
      // Top and Right labels
      ctx.fillText(`${currentQ.w} ${currentQ.unit}`, startX + rectW / 2, startY - 14);
      ctx.fillText(`${currentQ.h} ${currentQ.unit}`, startX + rectW + 28, startY + rectH / 2);

      // Extra 4-side labels for Q4-Q6 in modes 3 & 4
      if (currentQ.showExtraLabels) {
        ctx.fillText(`${currentQ.w} ${currentQ.unit}`, startX + rectW / 2, startY + rectH + 16);
        ctx.fillText(`${currentQ.h} ${currentQ.unit}`, startX - 28, startY + rectH / 2);
      }

    } else if (mode === 5) { // Triangle
      const scale = Math.min((canvas.width - padding * 2) / currentQ.w, (canvas.height - padding * 2) / currentQ.h);
      const triW = currentQ.w * scale;
      const triH = currentQ.h * scale;
      const startX = (canvas.width - triW) / 2;
      const startY = (canvas.height - triH) / 2;

      const p1 = { x: startX, y: startY + triH };
      const p2 = { x: startX + triW, y: startY + triH };
      const p3 = { x: startX + triW * 0.4, y: startY };

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.fillStyle = '#e0f2fe';
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Dashed Height Line
      ctx.beginPath();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 2;
      ctx.moveTo(p3.x, p3.y);
      ctx.lineTo(p3.x, p1.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Right Angle Marker
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(p3.x, p1.y - 10, 10, 10);

      // Label Texts
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`底: ${currentQ.w} ${currentQ.unit}`, startX + triW / 2, p1.y + 18);
      ctx.fillStyle = '#b91c1c';
      ctx.fillText(`高: ${currentQ.h} ${currentQ.unit}`, p3.x - 28, startY + triH / 2);

      // Distractor Side Labels for Q4-Q6
      if (currentQ.showExtraLabels) {
        ctx.fillStyle = '#64748b';
        ctx.fillText(`${currentQ.side1} ${currentQ.unit}`, (p1.x + p3.x)/2 - 18, (p1.y + p3.y)/2);
        ctx.fillText(`${currentQ.side2} ${currentQ.unit}`, (p2.x + p3.x)/2 + 20, (p2.y + p3.y)/2);
      }

    } else if (mode === 6) { // Trapezoid
      const maxW = currentQ.b;
      const scale = Math.min((canvas.width - padding * 2) / maxW, (canvas.height - padding * 2) / currentQ.h);
      const bottomW = currentQ.b * scale;
      const topW = currentQ.a * scale;
      const trapH = currentQ.h * scale;

      const startX = (canvas.width - bottomW) / 2;
      const startY = (canvas.height - trapH) / 2;
      const topOffset = (bottomW - topW) / 2;

      const p1 = { x: startX, y: startY + trapH };
      const p2 = { x: startX + bottomW, y: startY + trapH };
      const p3 = { x: startX + topOffset + topW, y: startY };
      const p4 = { x: startX + topOffset, y: startY };

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fillStyle = '#e0f2fe';
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Height Line
      ctx.beginPath();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 2;
      ctx.moveTo(p4.x, p4.y);
      ctx.lineTo(p4.x, p1.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(p4.x, p1.y - 10, 10, 10);

      // Base & Height Labels
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`上底: ${currentQ.a} ${currentQ.unit}`, startX + bottomW / 2, startY - 14);
      ctx.fillText(`下底: ${currentQ.b} ${currentQ.unit}`, startX + bottomW / 2, p1.y + 18);
      ctx.fillStyle = '#b91c1c';
      ctx.fillText(`高: ${currentQ.h} ${currentQ.unit}`, p4.x - 28, startY + trapH / 2);

      // Distractor Side Labels for Q4-Q6
      if (currentQ.showExtraLabels) {
        ctx.fillStyle = '#64748b';
        ctx.fillText(`${currentQ.side1} ${currentQ.unit}`, (p1.x + p4.x)/2 - 20, (p1.y + p4.y)/2);
        ctx.fillText(`${currentQ.side2} ${currentQ.unit}`, (p2.x + p3.x)/2 + 20, (p2.y + p3.y)/2);
      }
    }
  }

  function renderMCQOptions() {
    const mcq = document.getElementById('mcqContainer');
    mcq.innerHTML = '';
    const correctVal = `${currentQ.totalArea} ${currentQ.unit}²`;
    let opts = new Set([correctVal]);

    while (opts.size < 4) {
      let r = currentQ.totalArea + (Math.floor(Math.random() * 9) - 4);
      if (r > 0 && r !== currentQ.totalArea) opts.add(`${r} ${currentQ.unit}²`);
    }
    let optArray = Array.from(opts).sort(() => Math.random() - 0.5);

    optArray.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'mcq-btn';
      btn.innerText = opt;
      btn.onclick = () => checkMCQ(opt);
      mcq.appendChild(btn);
    });
  }

  function checkMCQ(selected) {
    const correctVal = `${currentQ.totalArea} ${currentQ.unit}²`;
    if (selected === correctVal) {
      showBigTickAndNext();
    } else {
      playSound('wrong');
      document.getElementById('feedback').className = 'feedback wrong';
      document.getElementById('feedback').innerText = '❌ 答案不對，再計算一下！點擊 💡 提示 看看公式哦！';
    }
  }

  function pressKey(val) {
    if (currentStep === 1) valEq += val;
    else valAns += val;
    updateDisplayFields();
  }

  function pressDelete() {
    if (currentStep === 1) {
      valEq = valEq.trimEnd();
      valEq = valEq.slice(0, -1);
    } else {
      valAns = valAns.trimEnd();
      valAns = valAns.slice(0, -1);
    }
    updateDisplayFields();
  }

  function updateDisplayFields() {
    document.getElementById('textEq').innerText = valEq;
    document.getElementById('textAns').innerText = valAns;
  }

  function normalizeEq(str) {
    return str.toLowerCase()
      .replace(/\s+/g, '')
      .replace(/×/g, 'x')
      .replace(/\*/g, 'x')
      .replace(/÷/g, '/');
  }

  function submitStep() {
    if (currentStep === 1) {
      const cleaned = normalizeEq(valEq);
      const validNormalized = currentQ.validEqs.map(normalizeEq);

      if (validNormalized.includes(cleaned)) {
        playSound('correct');
        currentStep = 2;
        document.getElementById('tickEq').classList.remove('hidden');
        document.getElementById('fieldEq').className = 'display-field locked';
        document.getElementById('rowAns').classList.remove('hidden');
        document.getElementById('feedback').className = 'feedback correct';
        document.getElementById('feedback').innerText = '🎉 算式正確！請在下方框框填寫面積與單位。';
      } else {
        playSound('wrong');
        document.getElementById('feedback').className = 'feedback wrong';
        document.getElementById('feedback').innerText = '❌ 算式不正確！如果忘記公式可點擊右上角 💡 提示！';
      }
    } else if (currentStep === 2) {
      const cleanedAns = normalizeEq(valAns);
      const userNumMatch = cleanedAns.match(/\d+/);
      const userNum = userNumMatch ? parseInt(userNumMatch[0]) : null;
      
      const isNumCorrect = (userNum === currentQ.validAnsNum);
      const hasCorrectUnit = cleanedAns.includes(currentQ.validUnitStr.toLowerCase());

      if (isNumCorrect && hasCorrectUnit) {
        showBigTickAndNext();
      } else if (isNumCorrect && !hasCorrectUnit) {
        // Smart hint: Number is correct, but unit is missing or wrong (Without spoiling the exact unit!)
        playSound('wrong');
        document.getElementById('feedback').className = 'feedback wrong';
        document.getElementById('feedback').innerText = '💡 數字計算正確！別忘了補上面積單位（cm² 或 m²）哦！';
      } else {
        playSound('wrong');
        document.getElementById('feedback').className = 'feedback wrong';
        document.getElementById('feedback').innerText = '❌ 數字計算不正確，請再仔細算算看！';
      }
    }
  }

  function showBigTickAndNext() {
    playSound('correct');
    const overlay = document.getElementById('bigTickOverlay');
    overlay.classList.remove('hidden');

    setTimeout(() => {
      overlay.classList.add('hidden');
      currentQIndex++;
      if (currentQIndex > 6) {
        currentQIndex = 1;
        if (mode < 6) {
          mode++;
          triggerLevelUp();
        } else {
          mode = 1;
          triggerLevelUp('🏆 太厲害了！你已通關圖形面積大冒險全部關卡！');
        }
      } else {
        initQuestion();
      }
    }, 1200);
  }

  function triggerLevelUp(customText) {
    playSound('levelup');
    document.getElementById('modalTitle').innerText = customText ? customText : `🎉 恭喜晉級到 關卡 ${mode}！`;
    document.getElementById('modalDesc').innerText = customText 
      ? '你已經掌握了長方形、正方形、三角形與梯形面積計算的終極技巧！' 
      : `關卡 ${mode} 挑戰：${getModeDescription(mode)}`;
    document.getElementById('levelModal').classList.remove('hidden');
  }

  function getModeDescription(m) {
    switch (m) {
      case 2: return '寫出完整長×寬算式與正確面積單位！';
      case 3: return '沒有格仔提示，看圖算出長方形/正方形面積並選擇答案！';
      case 4: return '沒有格仔提示，填寫長方形/正方形算式與答案！';
      case 5: return '挑戰三角形面積：寫出 底×高÷2 算式與答案！';
      case 6: return '終極挑戰梯形面積：寫出 (上底+下底)×高÷2 算式與答案！';
      default: return '';
    }
  }

  function closeModal() {
    document.getElementById('levelModal').classList.add('hidden');
    initQuestion();
  }

  window.addEventListener('resize', drawShape);
  initQuestion();
</script>
</body>
</html>
